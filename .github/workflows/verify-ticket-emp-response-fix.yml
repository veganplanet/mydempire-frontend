name: Verify Ticket EMP response fix

on:
  push:
    branches:
      - fix-ticket-emp-response-check-20260905

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ticket-emp-response-check-20260905

      - name: Verify exact intended diff
        shell: bash
        run: |
          git fetch origin main
          node --check js/goods-ticket.js
          git diff --check origin/main...HEAD
          test "$(git diff --name-only origin/main...HEAD)" = "js/goods-ticket.js"
          git diff origin/main...HEAD -- js/goods-ticket.js

      - name: Remove temporary verifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-ticket-emp-response-fix.yml
          git commit -m "chore: remove temporary Ticket verifier"
          git push origin HEAD:fix-ticket-emp-response-check-20260905
