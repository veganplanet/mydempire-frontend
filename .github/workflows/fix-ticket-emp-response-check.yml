name: Fix Ticket EMP response check

on:
  push:
    branches:
      - fix-ticket-emp-response-check-20260905

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-ticket-emp-response-check-20260905

      - name: Apply exact guarded response-check fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/goods-ticket.js')
          text = path.read_text()

          old = 'if (!empResponse.ok || !empData.success) {'
          new = 'if (!empResponse.ok) {'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 old EMP response check, found {count}. No change made.')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify JavaScript syntax and exact diff
        shell: bash
        run: |
          node --check js/goods-ticket.js
          git diff --check
          git diff -- js/goods-ticket.js

      - name: Commit only the Ticket EMP response fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ticket-emp-response-check.yml
          git add js/goods-ticket.js
          git commit -m "fix: accept empire overview EMP response"
          git push origin HEAD:fix-ticket-emp-response-check-20260905
